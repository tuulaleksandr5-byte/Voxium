name: Format temporary functional stations branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/functional-stations-dark-inventory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/functional-stations-dark-inventory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatted Rust
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/ crates/
            git commit -m "style: apply cargo fmt to crafting stations"
            git push origin HEAD:feature/functional-stations-dark-inventory
          fi
