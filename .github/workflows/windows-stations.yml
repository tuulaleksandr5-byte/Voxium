name: Windows x64 - Minecraft inventory UI

on:
  pull_request:
    branches: [main, feature/functional-stations-dark-inventory, feature/minecraft-optifine-resourcepacks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test game core
        run: cargo test --locked -p game_core
      - name: Compile native Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p voxel-client
      - name: Stage portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/voxel-client.exe dist/Voxium.exe
          'Voxium Minecraft-style UI preview with resourcepack backgrounds, functional stations and original fallback textures. Put ZIP at assets/resourcepacks/active.zip. Not full OptiFine; no Animals source. Back up worlds.' | Out-File dist/README.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Voxium-Minecraft-Inventory-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
