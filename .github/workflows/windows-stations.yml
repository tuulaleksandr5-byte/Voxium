name: Windows x64 - functional stations preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test game core
        run: cargo test --locked -p game_core
      - name: Compile native Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p voxel-client
      - name: Stage portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/voxel-client.exe dist/Voxium.exe
          'Built from the public alpha.4 source branch with new crafting/furnace features. NOT the Animals binary. Back up saves-v2 before using.' | Out-File dist/README.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Voxium-Stations-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
